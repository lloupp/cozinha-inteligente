<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f7a4c" />
  <meta name="description" content="Descubra o que cozinhar com o que você já tem em casa. Zero desperdício." />
  <title>Tem em Casa? — Cozinha Inteligente</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1f7a4c"/>
          <path d="M20 10c-1.2 4-1.2 7.5 0 11.5 1.2-4 1.2-7.5 0-11.5z" fill="#d8f3e4"/>
          <path d="M14 16c3.5 1.2 6.5 3.5 8 7-3.5-1.5-6.5-3.8-8-7z" fill="#a7e4c4"/>
          <path d="M26 16c-3.5 1.2-6.5 3.5-8 7 3.5-1.5 6.5-3.8 8-7z" fill="#a7e4c4"/>
          <path d="M20 21v9" stroke="#d8f3e4" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Tem em Casa?</h1>
        <p class="tagline">Cozinha inteligente · zero desperdício</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card input-card" aria-labelledby="input-title">
      <div class="card-eyebrow">Comece por aqui</div>
      <h2 id="input-title">O que tem na geladeira?</h2>
      <p class="hint">Digite ou toque nas sugestões. Separe por vírgula ou Enter.</p>

      <div class="tags-input" id="tagsInput">
        <input type="text" id="ingredientField" aria-label="Ingredientes disponíveis" placeholder="ex: ovo, tomate, queijo…" autocomplete="off" />
      </div>
      <div class="suggestions" id="suggestions" role="list" aria-label="Sugestões de ingredientes"></div>

      <div class="photo-row">
        <label class="photo-btn">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Foto da geladeira
          <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />
        </label>
        <span class="photo-note" id="photoNote" aria-live="polite"></span>
      </div>

      <details class="advanced">
        <summary>
          <span class="advanced-label">Filtros e o que está vencendo</span>
          <span class="advanced-chevron" aria-hidden="true"></span>
        </summary>
        <div class="advanced-body">
          <label class="field-label" for="vencendoField">Ingredientes vencendo (priorize receitas que os usem)</label>
          <input type="text" id="vencendoField" placeholder="ex: leite, banana" autocomplete="off" />

          <span class="field-label" id="diet-label">Dietas</span>
          <div class="chips" id="dietChips" role="group" aria-labelledby="diet-label">
            <button type="button" class="chip" data-dieta="sem lactose" aria-pressed="false">Sem lactose</button>
            <button type="button" class="chip" data-dieta="vegano" aria-pressed="false">Vegano</button>
            <button type="button" class="chip" data-dieta="low carb" aria-pressed="false">Low carb</button>
            <button type="button" class="chip" data-dieta="sem gluten" aria-pressed="false">Sem glúten</button>
            <button type="button" class="chip" data-dieta="proteico" aria-pressed="false">Proteico</button>
            <button type="button" class="chip" data-dieta="economico" aria-pressed="false">Econômico</button>
            <button type="button" class="chip" data-dieta="vegetariano" aria-pressed="false">Vegetariano</button>
          </div>

          <span class="field-label" id="difficulty-label">Dificuldade</span>
          <div class="chips" id="difficultyChips" role="group" aria-labelledby="difficulty-label">
            <button type="button" class="chip" data-dificuldade="muito facil" aria-pressed="false">Muito fácil</button>
            <button type="button" class="chip" data-dificuldade="facil" aria-pressed="false">Fácil</button>
            <button type="button" class="chip" data-dificuldade="media" aria-pressed="false">Média</button>
            <button type="button" class="chip" data-dificuldade="chef" aria-pressed="false">Chef</button>
          </div>

          <label class="toggle">
            <input type="checkbox" id="soTenho" />
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-text">Modo “Só tenho isso” — só receitas 100% factíveis</span>
          </label>
        </div>
      </details>

      <button type="button" class="primary-btn" id="buscarBtn">
        <span class="btn-label">Ver o que dá pra fazer</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <button type="button" class="secondary-btn" id="copiarLista" style="margin-top: 0.5rem;" hidden>
        Copiar lista de compras
      </button>
    </section>

    <section id="resultados" class="resultados" aria-live="polite" aria-label="Receitas encontradas"></section>
  </main>

  <footer class="footer">
    <p>Tem em Casa? — reduza o desperdício e cozinhe com o que já possui.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
