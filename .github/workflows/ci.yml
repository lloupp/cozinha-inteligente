name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate Python syntax
        run: python -m compileall -q app.py engine.py tests
      - name: Validate frontend syntax
        run: |
          node --check static/app.js
          node --check static/sw.js
      - name: Validate recipe JSON
        run: python -m json.tool receitas.json > /dev/null
      - name: Run tests with coverage gate
        run: pytest -q --cov=app --cov=engine --cov-report=term-missing --cov-fail-under=80

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t cozinha-inteligente:ci .
      - name: Smoke test production container
        run: |
          docker run -d --name cozinha-ci -p 5050:5000 cozinha-inteligente:ci
          trap 'docker rm -f cozinha-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5050/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs cozinha-ci
          exit 1
